[project]
name = "etl-pipeline-mcp"
version = "1.0.0"
description = "A sovereign, local-first MCP-Native ETL System with Hot/Cold tiering, PII scrubbing, ID stitching, and warehouse exports."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SEOSiri-Official", email = "info@seosiri.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security"
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.31.1"
]

[project.urls]
Documentation = "https://www.seosiri.com/2026/07/seosiri-mcp-servers.html"
Homepage = "https://www.seosiri.com/2026/07/etl-pipeline-mcp.html"
Repository = "https://www.seosiri.com/2026/07/etl-pipeline-mcp.html.git"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]