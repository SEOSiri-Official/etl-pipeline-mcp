[project]
name = "etl-pipeline-mcp"
version = "1.0.3"
description = "A sovereign, local-first MCP-Native ETL System with Hot/Cold tiering, PII scrubbing, ID stitching, Parquet buffers, and data warehouse exports."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SEOSiri-Official", email = "info@seosiri.com" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security"
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.31.1"
]

[project.urls]
Homepage = "https://www.seosiri.com/2026/07/etl-pipeline-mcp.html"
Documentation = "https://www.seosiri.com/2026/07/seosiri-mcp-servers.html"
Repository = "https://github.com/SEOSiri-Official/etl-pipeline-mcp.git"

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]