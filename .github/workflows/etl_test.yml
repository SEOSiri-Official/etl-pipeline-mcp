name: ETL Pipeline Test Suite
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel pytest requests fastapi uvicorn "mcp>=1.0.0"
          pip install --no-build-isolation -e .
          
      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_etl_pipeline.py